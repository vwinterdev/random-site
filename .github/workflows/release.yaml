name: Publish image

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          LATEST="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          SOURCE="https://github.com/$GITHUB_REPOSITORY"
          docker build -t "$IMAGE" -t "$LATEST" \
            --label "org.opencontainers.image.source=$SOURCE" .
          docker push "$IMAGE"
          docker push "$LATEST"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --generate-notes
